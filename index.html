<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jam Dunia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Jam Dunia</h1>
    <div class="header-actions">
      <label class="toggle">
        <input type="checkbox" id="format24">
        Format 24 jam
      </label>
      <button id="theme-toggle" type="button" class="icon-btn">🌙</button>
    </div>
  </header>

  <section id="globe-wrap">
    <canvas id="globe" role="img" aria-label="Glob interaktif menunjukkan waktu semasa bandar utama serta kawasan siang dan malam"></canvas>
    <div class="globe-zoom">
      <button id="zoom-in" type="button" aria-label="Zum masuk">+</button>
      <button id="zoom-out" type="button" aria-label="Zum keluar">−</button>
    </div>
    <p class="hint">Seret untuk putar · scroll/cubit untuk zum · klik bandar untuk tambah</p>
  </section>

  <section id="time-control">
    <div class="time-row">
      <button id="time-play" type="button" class="play-btn" aria-label="Main 24 jam">▶</button>
      <label for="time-slider">Penukar masa</label>
      <span id="time-label" aria-live="polite">Sekarang</span>
      <button id="time-reset" type="button" class="secondary" hidden>Kembali ke sekarang</button>
    </div>
    <input type="range" id="time-slider" min="-96" max="96" step="1" value="0" aria-describedby="time-label">
    <div class="time-scale" aria-hidden="true"><span>−24j</span><span>Sekarang</span><span>+24j</span></div>
  </section>

  <form id="add-form">
    <input id="zone-input" list="zone-list" placeholder="Cari bandar, cth. Paris" autocomplete="off" required>
    <datalist id="zone-list"></datalist>
    <button type="submit">Tambah</button>
  </form>
  <p id="form-error" class="error" hidden></p>

  <main id="clocks"></main>

  <section id="planner">
    <h2>Perancang mesyuarat</h2>
    <p id="planner-summary"></p>
    <div class="planner-scroll">
      <table id="planner-table"></table>
    </div>
    <p class="legend">
      <span class="swatch work"></span>Waktu kerja (09:00–17:00)
      <span class="swatch off"></span>Luar waktu kerja
      <span class="swatch sleep"></span>Waktu tidur (22:00–07:00)
      · Klik satu jam untuk lihat masa itu.
    </p>
  </section>

  <script src="vendor/d3-array.min.js"></script>
  <script src="vendor/d3-geo.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/land-110m.js"></script>
  <script src="globe.js"></script>
  <script src="app.js"></script>
</body>
</html>
