name: Cuti umum

# Monthly: regenerates js/my-holidays.js for this year and the next from the
# latest python-holidays (new gazettes, corrected Islamic dates). When the
# holidays themselves changed, it runs the tests and opens a pull request.
# A pull request opened by Actions does not start the test workflow, hence
# the tests here. Needs Settings → Actions → General → "Allow GitHub Actions
# to create and approve pull requests".

on:
  schedule:
    - cron: '41 1 1 * *' # 09:41 in Malaysia on the 1st
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: python -m pip install holidays

      - run: python scripts/build-holidays.py "$(date +%Y)" "$(( $(date +%Y) + 1 ))"

      # The header names the package's version; a new version alone is no change.
      - id: diff
        run: |
          if git diff --quiet -I '^//' -- js/my-holidays.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cuti umum tidak berubah."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- js/my-holidays.js
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.diff.outputs.changed == 'true'
        run: npm ci && npx playwright install --with-deps chromium

      - if: steps.diff.outputs.changed == 'true'
        run: npx playwright test
        env:
          CI: true

      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="cuti-umum/$(date +%Y-%m)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add js/my-holidays.js
          git commit -m "Kemas kini cuti umum Malaysia ($(date +%Y)–$(( $(date +%Y) + 1 )))"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "Kemas kini cuti umum Malaysia ($(date +%Y)–$(( $(date +%Y) + 1 )))" \
              --body "Dijana oleh aliran kerja **Cuti umum** daripada python-holidays terkini. Ujian Playwright sudah lulus dalam aliran kerja ini. Semak tarikh cuti Islam dengan pewartaan sebelum merge."
          fi
